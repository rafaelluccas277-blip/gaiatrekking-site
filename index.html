<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA TREKKING</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   🎨 CORES DO SITE — EDITE AQUI SE QUISER MUDAR AS CORES
   ============================================================ */
:root{
  --violet:#8A2BE2;        /* Cor principal do site (violeta) */
  --violet-light:#b07ae8;  /* Violeta mais claro */
  --violet-glow:rgba(138,43,226,.25);  /* Brilho violeta */
  --bg:#0a0a0a;            /* Fundo do site (quase preto) */
  --card:#111111;          /* Fundo dos cards */
  --text:#e8e0d0;          /* Cor do texto */
  --earth:#8B7355;         /* Cor terrosa (detalhes de trilha) */
  --green:#4ade80;         /* Fácil */
  --yellow:#fbbf24;        /* Moderada */
  --red:#f87171;           /* Difícil */
}

*{ margin:0; padding:0; box-sizing:border-box; }

/* ============================================================
   🏔️ FUNDO DO SITE — Textura de trilha
   ============================================================ */
body{
  background-color:var(--bg);
  font-family:'Rajdhani', sans-serif;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  cursor:default;
}

/* Textura de granulado (efeito de terra/pedra) */
body::before{
  content:'';
  position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:0; opacity:.6;
}

/* Linhas diagonais de fundo (estilo trilha) */
body::after{
  content:'';
  position:fixed; inset:0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 60px,
    rgba(138,43,226,.015) 60px,
    rgba(138,43,226,.015) 61px
  );
  pointer-events:none; z-index:0;
}

/* ============================================================
   ✨ VAGALUMES — Efeito de luzes flutuantes no fundo
   ============================================================ */
.fireflies{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}

.firefly{
  position:absolute;
  width:3px;
  height:3px;
  background:var(--violet-light);
  border-radius:50%;
  opacity:0;
  animation: fireflyFloat var(--duration) ease-in-out infinite;
  animation-delay: var(--delay);
  box-shadow:0 0 6px 1px var(--violet-glow);
}

@keyframes fireflyFloat{
  0%, 100%{
    opacity:0;
    transform:translate(0, 0);
  }
  10%{
    opacity:.8;
  }
  50%{
    opacity:.4;
    transform:translate(var(--move-x), var(--move-y));
  }
  90%{
    opacity:.6;
  }
}

/* ============================================================
   🏔️ LOGO
   ============================================================ */
.logo-wrap{
  position:relative; z-index:1;
  display:flex; justify-content:center;
  padding:50px 20px 0;
  animation: fadeDown .9s ease both;
}

.logo-wrap img{
  max-width:180px; height:auto;
  border-radius:20%;
}

/* ============================================================
   🗻 HERO (TÍTULO PRINCIPAL)
   ============================================================ */
header{
  position:relative; z-index:1;
  padding:32px 20px 70px;
  text-align:center;
}

.hero-eyebrow{
  font-family:'Rajdhani', sans-serif;
  font-size:.75rem;
  letter-spacing:6px;
  text-transform:uppercase;
  color:var(--violet);
  opacity:.8;
  margin-bottom:16px;
  animation: fadeDown .9s .1s ease both;
}

header h1{
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(2.8rem, 8vw, 5.5rem);
  font-weight:300;
  color:var(--text);
  letter-spacing:8px;
  line-height:1.1;
  animation: fadeDown .9s .2s ease both;
}

header h1 span{
  color:var(--violet);
  font-weight:700;
}

.hero-line{
  display:flex; align-items:center; justify-content:center;
  gap:16px; margin:22px auto 0; max-width:340px;
  animation: fadeDown .9s .3s ease both;
}

.hero-line::before, .hero-line::after{
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--violet), transparent);
}

.hero-sub{
  font-family:'Rajdhani'; font-size:.8rem;
  letter-spacing:4px; text-transform:uppercase;
  color:var(--violet-light); opacity:.7;
}

/* ============================================================
   📦 CONTAINER PRINCIPAL
   ============================================================ */
.container{
  width:min(1200px,95%); margin:auto;
  position:relative; z-index:1;
}

/* ============================================================
   🗺️ TIMELINE DE EXPEDIÇÃO
   ============================================================ */
.timeline{
  position:relative;
  padding-left:40px;
}

/* Linha vertical da trilha */
.timeline::before{
  content:'';
  position:absolute;
  left:15px;
  top:0;
  bottom:0;
  width:2px;
  background:linear-gradient(to bottom, var(--violet), var(--violet-light), var(--violet));
  opacity:.3;
}

/* ============================================================
   🗓️ ITEM DE MÊS (PARADA NA TRILHA)
   ============================================================ */
.month-item{
  position:relative;
  margin-bottom:32px;
  opacity:0;
  animation: cardReveal .6s ease forwards;
}

.month-item:nth-child(1){ animation-delay:.1s }
.month-item:nth-child(2){ animation-delay:.2s }
.month-item:nth-child(3){ animation-delay:.3s }
.month-item:nth-child(4){ animation-delay:.4s }
.month-item:nth-child(5){ animation-delay:.5s }
.month-item:nth-child(6){ animation-delay:.6s }

/* Ponto na trilha (estilo waypoint) */
.month-item::before{
  content:'';
  position:absolute;
  left:-33px;
  top:24px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--violet);
  border:3px solid var(--bg);
  box-shadow:0 0 0 2px var(--violet), 0 0 12px var(--violet-glow);
  z-index:2;
}

/* ============================================================
   🎫 CARD DO MÊS
   ============================================================ */
.month-card{
  background:var(--card);
  border:1px solid rgba(138,43,226,.15);
  border-radius:8px;
  overflow:hidden;
  transition: all .3s ease;
}

.month-card:hover{
  border-color:rgba(138,43,226,.4);
  box-shadow:0 8px 32px rgba(138,43,226,.1);
  transform:translateY(-2px);
}

/* Header do mês */
.month-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 24px;
  background:linear-gradient(135deg, rgba(138,43,226,.08) 0%, transparent 100%);
  border-bottom:1px solid rgba(138,43,226,.1);
}

.month-title{
  display:flex;
  align-items:center;
  gap:14px;
}

.month-number{
  font-family:'Cormorant Garamond', serif;
  font-size:2.5rem;
  font-weight:700;
  color:var(--violet);
  line-height:1;
  opacity:.9;
}

.month-name{
  font-family:'Cormorant Garamond', serif;
  font-size:1.3rem;
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--text);
}

.month-count{
  font-family:'Rajdhani', sans-serif;
  font-size:.75rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--violet-light);
  background:rgba(138,43,226,.1);
  padding:4px 12px;
  border-radius:20px;
  border:1px solid rgba(138,43,226,.2);
}

/* ============================================================
   🥾 LISTA DE TRILHAS
   ============================================================ */
.trails-list{
  padding:8px 0;
}

/* ============================================================
   🥾 TRILHA INDIVIDUAL
   ============================================================ */
.trail{
  display:flex;
  align-items:flex-start;
  gap:16px;
  padding:14px 24px;
  border-bottom:1px solid rgba(255,255,255,.03);
  transition: all .2s ease;
  position:relative;
}

.trail:last-child{
  border-bottom:none;
}

.trail:hover{
  background:rgba(138,43,226,.05);
  padding-left:28px;
}

/* Data da trilha */
.trail-date{
  font-family:'Rajdhani', sans-serif;
  font-size:.8rem;
  font-weight:600;
  letter-spacing:1px;
  color:var(--violet);
  min-width:50px;
  padding-top:2px;
  opacity:.9;
}

/* Ícone de dificuldade */
.trail-difficulty{
  width:8px;
  height:8px;
  border-radius:50%;
  flex-shrink:0;
  margin-top:6px;
}

.trail-difficulty.easy{ background:var(--green); box-shadow:0 0 6px var(--green); }
.trail-difficulty.medium{ background:var(--yellow); box-shadow:0 0 6px var(--yellow); }
.trail-difficulty.hard{ background:var(--red); box-shadow:0 0 6px var(--red); }

/* Nome da trilha */
.trail-name{
  font-family:'Rajdhani', sans-serif;
  font-size:.95rem;
  font-weight:400;
  line-height:1.5;
  color:var(--text);
  opacity:.85;
  flex:1;
}



/* ============================================================
   🧗 RAPEL SEMANAL
   ============================================================ */
.rapel{
  margin:50px 0 60px;
  position:relative;
  border:1px solid rgba(138,43,226,.35);
  border-radius:12px;
  padding:50px 40px;
  text-align:center;
  background:linear-gradient(135deg, #0c0810 0%, #0f0f0f 60%);
  animation: fadeUp .8s .7s ease both; opacity:0;
  overflow:hidden;
}

/* Ícone de rapel decorativo */
.rapel::before{
  content:'🧗';
  position:absolute;
  top:-20px;
  right:-20px;
  font-size:120px;
  opacity:.05;
  transform:rotate(-15deg);
}

/* Cantos decorativos */
.rapel::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg, transparent, var(--violet), transparent);
}

.rapel-label{
  font-family:'Rajdhani', sans-serif;
  font-size:.72rem;
  letter-spacing:6px;
  color:var(--violet);
  text-transform:uppercase;
  opacity:.6;
  margin-bottom:14px;
}

.rapel h2{
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:300;
  color:var(--text);
  letter-spacing:4px;
  margin-bottom:28px;
}

.rapel h2 strong{
  color:var(--violet);
  font-weight:700;
}

.rapel-infos{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px 30px;
}

.rapel-info{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.9rem;
  letter-spacing:1px;
  opacity:.75;
}

.rapel-info::before{
  content:'';
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--violet);
  flex-shrink:0;
}

/* ============================================================
   🏔️ FOOTER (RODAPÉ)
   ============================================================ */
footer{
  position:relative;
  z-index:1;
  text-align:center;
  padding:32px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  border-top:1px solid rgba(138,43,226,.12);
}

.footer-brand{
  font-family:'Cormorant Garamond', serif;
  font-size:1rem;
  letter-spacing:5px;
  text-transform:uppercase;
  color:var(--violet);
  opacity:.5;
}

.footer-sep{
  width:1px;
  height:18px;
  background:rgba(138,43,226,.25);
}

footer a.insta-link{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--violet-light);
  text-decoration:none;
  font-family:'Rajdhani', sans-serif;
  font-size:.8rem;
  letter-spacing:2px;
  text-transform:uppercase;
  opacity:.6;
  transition:opacity .2s;
}

footer a.insta-link:hover{ opacity:1; }
footer a.insta-link svg{ width:16px; height:16px; fill:currentColor; }

/* ============================================================
   💬 BOTÃO WHATSAPP FLUTUANTE
   ============================================================ */
.whatsapp-float{
  position:fixed;
  bottom:32px;
  right:32px;
  z-index:999;
  width:56px;
  height:56px;
  background:#25d366;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 0 0 rgba(37,211,102,.5);
  text-decoration:none;
  animation:fadeUp .6s 1.2s ease forwards;
  opacity:0;
  transition:transform .2s, box-shadow .2s;
}

.whatsapp-float.pulsing{
  animation:pulse 2.5s infinite;
}

.whatsapp-float:hover{
  transform:scale(1.1);
  box-shadow:0 8px 28px rgba(37,211,102,.5);
}

.whatsapp-float svg{
  width:28px;
  height:28px;
  fill:white;
}

.whatsapp-float::before{
  content:"Fale conosco";
  position:absolute;
  right:66px;
  background:rgba(10,10,10,.9);
  border:1px solid rgba(138,43,226,.3);
  color:var(--violet-light);
  font-family:'Rajdhani', sans-serif;
  font-size:.75rem;
  letter-spacing:2px;
  text-transform:uppercase;
  padding:6px 14px;
  border-radius:2px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

.whatsapp-float:hover::before{ opacity:1; }

/* ============================================================
   ✨ ANIMAÇÕES
   ============================================================ */
@keyframes fadeDown{
  from{ opacity:0; transform:translateY(-20px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(24px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes cardReveal{
  from{ opacity:0; transform:translateY(16px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(37,211,102,.55); }
  70%{ box-shadow:0 0 0 14px rgba(37,211,102,0); }
  100%{ box-shadow:0 0 0 0 rgba(37,211,102,0); }
}

/* ============================================================
   📱 RESPONSIVO (CELULAR)
   ============================================================ */
@media(max-width:600px){
  header h1{ letter-spacing:4px; }
  .rapel{ padding:36px 22px; }
  footer{ flex-wrap:wrap; gap:12px; }
  .footer-sep{ display:none; }
  .timeline{ padding-left:30px; }
  .timeline::before{ left:10px; }
  .month-item::before{ left:-25px; width:10px; height:10px; }
  .month-header{ padding:16px 18px; }
  .trail{ padding:12px 18px; }
  .trail:hover{ padding-left:22px; }
  .month-number{ font-size:2rem; }
  .month-name{ font-size:1.1rem; }
}

</style>
</head>

     ╔══════════════════════════════════════════════════════════╗
     ║  COMO ADICIONAR UMA TRILHA:                             ║
     ║  1. Copie um bloco de evento (data + name)               ║
     ║  2. Cole no mês certo                                    ║
     ║  3. Troque a data e o nome                               ║
     ║                                                          ║
     ║  COMO ADICIONAR UM MÊS NOVO:                            ║
     ║  1. Copie um bloco de mês inteiro                        ║
     ║  2. Cole no final da lista                               ║
     ║  3. Troque o número, o nome e os eventos                  ║
     ╚══════════════════════════════════════════════════════════╝
     ============================================================ -->
<script>
const ROTEIROS = [
  {
    mes: "Julho",
    numero: "07",
    eventos: [
      { data: "10-12", nome: "Praias Selvagens com Rapel no Pontal e tartaruga (Camping roots)", dificuldade: "hard", tag: "camping" },
      { data: "18–19", nome: "Arraiá Gaia Trekking - Vale das Bromélias (Camping Estruturado)", dificuldade: "medium", tag: "camping" },
      { data: "24-26", nome: "Travessia Marins × Itaguaré", dificuldade: "hard", tag: "travessia" }
    ]
  },
  {
    mes: "Agosto",
    numero: "08",
    eventos: [
      { data: "01–02", nome: "Travessia 7 cumes - Serra do Ibitiraquire", dificuldade: "hard", tag: "travessia" },

      <div class="trail">
        <div class="trail-date">${ev.data}</div>

<script>
  // ✨ Gerador de vagalumes — leve e com tema de trilha
  const firefliesContainer = document.getElementById('fireflies');
  const FIREFLY_COUNT = 15;

  for (let i = 0; i < FIREFLY_COUNT; i++) {
    const firefly = document.createElement('div');
    firefly.className = 'firefly';

    // Posição aleatória
    const x = Math.random() * 100;
    const y = Math.random() * 100;

    // Movimento aleatório
    const moveX = (Math.random() - 0.5) * 200;
    const moveY = (Math.random() - 0.5) * 200;

    // Duração e delay aleatórios
    const duration = 8 + Math.random() * 12;
    const delay = Math.random() * 10;

    firefly.style.left = `${x}%`;
    firefly.style.top = `${y}%`;
    firefly.style.setProperty('--move-x', `${moveX}px`);
    firefly.style.setProperty('--move-y', `${moveY}px`);
    firefly.style.setProperty('--duration', `${duration}s`);
    firefly.style.setProperty('--delay', `${delay}s`);

    firefliesContainer.appendChild(firefly);
  }
</script>

<script>
  const btn = document.querySelector('.whatsapp-float');
  btn.addEventListener('animationend', () => {
    btn.style.opacity = '1';
    btn.style.animation = 'none';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      btn.classList.add('pulsing');
    }));
  }, { once: true });
</script>
